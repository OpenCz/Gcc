version: '3.9'

services:
  db:
    container_name: db
    image: postgres:16
    ports:
      - "5432:5432"
    networks:
      - back-tier
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: on-failure

  backend:
    container_name: backend
    build: ./backend
    ports:
      - "8080:8080"
    networks:
      - back-tier
      - front-tier
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - UPLOADS_DIR=/app/uploads
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_REDIRECT_URI=${MICROSOFT_REDIRECT_URI}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID}
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:6767"
    networks:
      - front-tier
    environment:
      - API_URL=${API_URL}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6767 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure

networks:
  back-tier:
    name: back-tier
  front-tier:
    name: front-tier

volumes:
  db-data:
    name: db-data
  uploads-data:
    name: uploads-data
